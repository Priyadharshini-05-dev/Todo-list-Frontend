<div class="bg-blue-300 flex justify-center items-center h-screen">
  <div class="flex flex-col justify-center items-center">

    <div class="text-4xl font-extrabold text-white mb-4">
      <h2 class="!font-extrabold !text-3xl">To-Do List</h2>
    </div>
    <form [formGroup]="taskForm" (ngSubmit)="saveTask()" class="flex flex-col gap bg-white/20 p-8 rounded-2xl w-96 backdrop:blur-md">
     <mat-form-field appearance="outline">
      <mat-label>Task Name</mat-label>
      <input matInput formControlName="taskName">
     </mat-form-field>
     <mat-form-field appearance="outline">
      <mat-label >  Description </mat-label>
       <textarea matInput rows="4" formControlName="description">
   </textarea>
     </mat-form-field>
     <mat-form-field appearance="outline">
      <mat-label>Due Date</mat-label>
      <input   matInput [matDatepicker]="picker"
      formControlName="dueDate">
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
     </mat-form-field>

     <mat-form-field appearance="outline">
      <mat-label>
      Status
      </mat-label>
      <mat-select formControlName="status">
        <mat-option value="Pending">
          Pending
        </mat-option>
      
        <mat-option value="In Progress">
          In Progress
        </mat-option>
        <mat-option value="Completed">
          Completed
        </mat-option>
      </mat-select>

     </mat-form-field>
     <button
     mat-raised-button
     color="primary"
     type="submit"
     >{{id?"Update Task" : "Save Task"}}</button>
    </form>
    </div>
</div>
