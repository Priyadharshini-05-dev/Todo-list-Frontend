<div class="min-h-screen bg-gradient-to-br from-blue-100 via-indigo-50  flex justify-center items-center px-4 py-8">
  <div class="w-full max-w-md">

    <div class="w-full mb-6 text-center">
      <h2 class="font-black text-4xl text-slate-800">
  To-Do List
</h2>
    </div>
    <form [formGroup]="taskForm" (ngSubmit)="saveTask()" class="flex flex-col gap-4 bg-white/80 p-5 sm:p-8 rounded-2xl w-full shadow-xl shadow-blue-900/10  border border-white/60  backdrop:blur-md">
     <mat-form-field appearance="outline" class="w-full">
      <mat-label>Task Name</mat-label>
      <input matInput formControlName="taskName">
     </mat-form-field>
     <mat-form-field appearance="outline" class="w-full">
      <mat-label >  Description </mat-label>
       <textarea matInput rows="4" formControlName="description">
   </textarea>
     </mat-form-field>
     <mat-form-field appearance="outline" class="w-full">
      <mat-label>Due Date</mat-label>
      <input   matInput [matDatepicker]="picker"
      formControlName="dueDate">
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
     </mat-form-field>

     <mat-form-field appearance="outline" class="w-full">
      <mat-label>
      Status
      </mat-label>
      <mat-select formControlName="status">
        <mat-option value="Pending">
          Pending
        </mat-option>
      
        <mat-option value="In Progress">
          In Progress
        </mat-option>
        <mat-option value="Completed">
          Completed
        </mat-option>
      </mat-select>

     </mat-form-field>
     <button 
     
     
     type="submit"
     class="w-full h-12 rounded-xl text-base font-semibold bg-indigo-700 hover:bg-indigo-800 text-white transition-colors duration-200"
     >{{id?"Update Task" : "Save Task"}}</button>
    </form>
    </div>
</div>
