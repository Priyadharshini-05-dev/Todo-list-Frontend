<div class="min-h-screen bg-blue-200 p-4 sm:p-6 lg:p-10">
  <div class="max-w-7xl mx-auto bg-white rounded-2xl shadow-xl p-4 sm:p-6 lg:p-8">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 sm:mb-8">
      <div>
        <h2 class="!text-3xl sm:!text-4xl lg:!text-5xl !font-extrabold !text-blue-700">Task List</h2>

        <p class="text-gray-500 mt-1">Manage your daily tasks easily</p>
      </div>

      <button
        class="bg-blue-500 hover:bg-blue-600 text-white px-5 py-2 rounded-lg transition w-full sm:w-auto text-center"
        routerLink="/task-form"
      >
        Add Task
      </button>
    </div>
    <div class="overflow-x-auto">
    <table
      mat-table
      [dataSource]="dataSource"
      class="w-full  min-w-[900px] rounded-xl table-auto"
    >
      <ng-container matColumnDef="completed">
        <th
          mat-header-cell
          *matHeaderCellDef
          class="!text-center text-base bg-blue-100 text-blue-700 py-4 font-bold w-24"
        >
          Done
        </th>

        <td
          mat-cell
          *matCellDef="let task"
          class="!text-center py-4 border-b w-24"
          [class.line-through]="task.status === 'Completed'"
          [class.text-gray-500]="task.status === 'Completed'"
        >
          <input
            type="checkbox"
            [checked]="task.status === 'Completed'"
            (change)="toggleTask(task)"
          />
        </td>
      </ng-container>

      <ng-container matColumnDef="taskName">
        <th
          mat-header-cell
          *matHeaderCellDef
          class="!text-center text-base bg-blue-100 text-blue-700 py-4 font-bold w-52"
        >
          Title
        </th>

        <td
          mat-cell
          *matCellDef="let task"
          class="!text-center py-4 border-b w-52"
          [class.line-through]="task.status === 'Completed'"
          [class.text-gray-500]="task.status === 'Completed'"
        >
          {{ task.taskName }}
        </td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th
          mat-header-cell
          *matHeaderCellDef
          class="!text-center bg-blue-100 text-base text-blue-700 py-4 font-bold w-72"
        >
          Description
        </th>

        <td
          mat-cell
          *matCellDef="let task"
          class="!text-center py-4 border-b w-72 whitespace-normal break-words"
          [class.line-through]="task.status === 'Completed'"
          [class.text-gray-500]="task.status === 'Completed'"
        >
          {{ task.description }}
        </td>
      </ng-container>

      <ng-container matColumnDef="dueDate">
        <th
        
          mat-header-cell
          *matHeaderCellDef
          class="!text-center bg-blue-100 text-base text-blue-700 py-4 font-bold w-40"
        >
          Due Date
        </th>

        <td
          mat-cell
          *matCellDef="let task"
          class="!text-center py-4 border-b w-40"
          [class.line-through]="task.status === 'Completed'"
          [class.text-gray-500]="task.status === 'Completed'"
        >
          {{ task.dueDate }}
        </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th
          mat-header-cell
          *matHeaderCellDef
          class="!text-center text-base bg-blue-100 text-blue-700 py-4 font-bold w-40"
        >
          Status
        </th>

        <td
          mat-cell
          *matCellDef="let task"
          class="!text-center py-4 border-b w-40"
          [class.line-through]="task.status === 'Completed'"
          [class.text-gray-500]="task.status === 'Completed'"
        >
          {{ task.status }}
        </td>
      </ng-container>

      <ng-container matColumnDef="action">
        <th
          mat-header-cell
          *matHeaderCellDef
          class="!text-center bg-blue-100 text-base text-blue-700 py-4 font-bold w-80"
        >
          Action
        </th>

        <td mat-cell *matCellDef="let task" class="py-4 border-b w-80">
          <div class="flex flex-wrap justify-center gap-2">
            <button class="bg-yellow-200 px-4 py-2 rounded-md">View</button>

            <button
              (click)="editTask(task.id)"
              class="bg-blue-400 text-white px-4 py-2 rounded-md"
            >
              Edit
            </button>

            <button
              (click)="deleteTask(task.id)"
              class="bg-red-500 text-white px-4 py-2 rounded-md"
            >
              Delete
            </button>
          </div>
        </td>
      </ng-container>

      <tr
        mat-header-row
        *matHeaderRowDef="displayColumns"
        class="!text-center"
      ></tr>

      <tr mat-row *matRowDef="let row; columns: displayColumns"></tr>
    </table>
    </div>
  </div>
</div>
